<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degrau 2: A Camada HTML (Input e Cabeçalho)</title>
    <style>
        table,
        th,
        td {
            border: 1px solid #334155;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div class="card-tela">
        <h3>Degrau 7: O Sistema Completo (Com I/O e Reset)</h3>

        <div class="linha-inputs">
            <input id="nome" placeholder="Nome">
            <input id="email" placeholder="E-mail">
            <input id="idade" type="number" placeholder="Idade">
            <button class="btn-acao btn-azul" id="btnSalvar" onclick="salvar()">Salvar</button>
        </div>

        <div class="linha-inputs barra-ferramentas">
            <button class="btn-acao btn-verde" onclick="exportar()">💾 Exportar</button>
            <label class="btn-acao btn-roxo">
                📂 Importar JSON
                <input type="file" accept=".json" onchange="importar(event)" style="display:none;">
            </label>
            <button class="btn-acao btn-vermelho" onclick="resetar()">🔄 Resetar Tudo</button>
        </div>

        <table class="tabela-dados">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Idade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
    <script>

        let alunos = [
            { id: 1, nome: "Aluno Exemplo", email: "exemplo@email.com" }
        ];
        let idEditando = null;
        let proximoId = 2;

        function listar() {
            const tbody = document.getElementById("lista");
            tbody.innerHTML = "";
            alunos.forEach(a => {
                tbody.innerHTML += `<tr>
            <td>${a.id}</td><td>${a.nome}</td><td>${a.email}</td>
            <td style="color:gray;">(vazio no JS)</td>
            <td><button disabled>Ações</button></td>
        </tr>`;
            });
        }
        listar();
    </script>
</body>

</html>
