<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>CRUD Alunos (JSON)</title>
</head>

<body>

    <h1>Alunos</h1>

    <input id="nome" placeholder="Nome">
    <input id="email" placeholder="E-mail">
    <input id="idade" type="number" placeholder="Idade">
    <button onclick="salvar()">Salvar</button>

    <button onclick="exportar()">💾 Exportar</button>
    <input type="file" accept=".json" onchange="importar(event)">
    <button onclick="resetar()">🔄 Resetar</button>

    <hr>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Idade</th>
            <th>Ações</th>
        </tr>
        <tbody id="lista"></tbody>
    </table>

    <script>
        let alunos = [];
        let idEditando = null;
        let proximoId = 1;

        const CHAVE = "alunos.json";

        function carregar() {
            const salvo = localStorage.getItem(CHAVE);
            if (salvo) {
                alunos = JSON.parse(salvo);
                proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;
            }
            listar();
        }

        function persistir() {
            localStorage.setItem(CHAVE, JSON.stringify(alunos));
        }

        function listar() {
            const lista = document.getElementById("lista");
            lista.innerHTML = "";
            alunos.forEach(a => {
                lista.innerHTML += `<tr>
            <td>${a.id}</td><td>${a.nome}</td><td>${a.email}</td>
            <td style="color:gray;">(aguardando JS)</td>
            <td>
                <button onclick="editar(${a.id})">Editar</button>
                <button onclick="excluir(${a.id})">Excluir</button>
            </td></tr>`;
            });
        }

        function salvar() {
            const nome = document.getElementById("nome");
            const email = document.getElementById("email");

            if (idEditando) {
                const a = alunos.find(x => x.id === idEditando);
                a.nome = nome.value;
                a.email = email.value;
                idEditando = null;
            } else {
                alunos.push({ id: proximoId++, nome: nome.value, email: email.value });
            }
            nome.value = email.value = "";
            persistir();
            listar();
        }

        function editar(id) {
            const nome = document.getElementById("nome");
            const email = document.getElementById("email");
            const a = alunos.find(x => x.id === id);
            nome.value = a.nome;
            email.value = a.email;
            idEditando = id;
        }

        function excluir(id) {
            if (confirm("Excluir aluno?")) {
                alunos = alunos.filter(a => a.id !== id);
                persistir();
                listar();
            }
        }

        function exportar() {
            const texto = JSON.stringify(alunos, null, 2);
            const blob = new Blob([texto], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "alunos.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(a.href);
        }

        function importar(evento) {
            const arquivo = evento.target.files[0];
            if (!arquivo) return;
            const leitor = new FileReader();
            leitor.onload = () => {
                try {
                    const dados = JSON.parse(leitor.result);
                    if (!Array.isArray(dados)) throw new Error("O JSON não é uma lista.");
                    alunos = dados;
                    proximoId = alunos.length ? Math.max(...alunos.map(a => a.id)) + 1 : 1;
                    persistir();
                    listar();
                    alert("Importado com sucesso!");
                } catch (e) {
                    alert("Arquivo inválido: " + e.message);
                }
            };
            leitor.readAsText(arquivo);
        }

        function resetar() {
            if (!confirm("Apagar tudo?")) return;
            localStorage.removeItem(CHAVE);
            alunos = [];
            proximoId = 1;
            listar();
        }

        carregar();
    </script>

</body>

</html>
